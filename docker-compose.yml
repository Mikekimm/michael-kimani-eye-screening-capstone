# Deployment stack: PostgreSQL + API + PWA behind nginx.  Usage:  docker compose up --build
# Secrets come from the same root .env the app uses locally (template: .env.example; run scripts/init_env.py
# first). There is no separate Docker env file. Not needed for local development.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screening
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screening-local-only}
      POSTGRES_DB: screening
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://screening:${POSTGRES_PASSWORD:-screening-local-only}@db:5432/screening
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
